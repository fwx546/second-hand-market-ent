<text x="52" y="1591" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#4b6846" text-anchor="start">示例联系信息。</text>
<text x="18" y="1888" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="400" fill="#756b62" text-anchor="start">✨ 保存到当前浏览器，好物信息由你掌握。</text>
